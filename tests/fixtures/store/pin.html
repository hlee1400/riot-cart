<!doctype html><html><head><title>Poro Pin</title><script src="/en-us/store.js"></script></head><body>
<h1 class="product-title" style="text-transform: uppercase">Poro Pin</h1>
<span class="price">$12.00</span>
<input id="qty" type="number" value="1" min="1" aria-label="Quantity">
<button id="add">Add to Cart</button>
<div id="added" hidden>Added to cart</div>
<div id="error"></div>
<a href="/en-us/cart" id="cart-link">Cart</a>
<script>
document.getElementById("add").onclick = () =>
  addLine("Poro Pin", "", parseInt(document.getElementById("qty").value), "$12.00");
</script></body></html>
