[project]
name = "riot-cart"
version = "0.1.0"
description = "Prototype: add Riot merch to a verified guest cart from Claude Code"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.48",
    "pydantic>=2.7",
    "pyyaml>=6",
    "requests>=2.31",
    "mcp>=1.2,<2",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker", "mcp_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
